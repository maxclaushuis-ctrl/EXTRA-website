<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWV Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 400px; 
        }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        button:hover { background: #2563eb; }
        .demo-accounts { 
            margin-top: 30px; 
            padding: 20px; 
            background: #f8f9fa; 
            border-radius: 4px; 
        }
        .demo-accounts h3 { color: #333; margin-bottom: 15px; }
        .account { 
            padding: 8px 12px; 
            background: white; 
            margin: 8px 0; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 14px; 
            cursor: pointer;
            border: 1px solid #e0e0e0;
        }
        .account:hover { background: #f0f0f0; }
        .message { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            display: none; 
        }
        .error { background: #fee; color: #c53030; border: 1px solid #feb2b2; }
        .success { background: #f0fff4; color: #38a169; border: 1px solid #9ae6b4; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>TWV Admin</h1>
        
        <div id="message" class="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Wachtwoord:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Inloggen</button>
        </form>
        
        <div class="demo-accounts">
            <h3>Demo Accounts</h3>
            <div class="account" onclick="fillLogin('admin@twv.nl', 'admin123')">
                Admin: admin@twv.nl / admin123
            </div>
            <div class="account" onclick="fillLogin('hr@twv.nl', 'hr123')">
                HR: hr@twv.nl / hr123
            </div>
        </div>
    </div>

    <script>
        function fillLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Inloggen geslaagd! Doorsturen...', 'success');
                    setTimeout(() => {
                        window.location.href = '/twv-dashboard';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Inloggen mislukt', 'error');
                }
            } catch (error) {
                showMessage('Er is een fout opgetreden', 'error');
            }
        });
    </script>
</body>
</html>
