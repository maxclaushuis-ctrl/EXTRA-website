<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"
     aria-label="Vergelijking van eigen housekeepingteam, uitbesteden aan een schoonmaakbedrijf en inlenen via een uitzendbureau">
  <defs>
    <style>
      .h  { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 700; }
      .b  { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 400; }
      .sb { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- Titel -->
  <text class="h" x="48" y="62" font-size="30" fill="#111111">Drie manieren om je housekeeping te bemensen</text>
  <text class="b" x="48" y="94" font-size="17" fill="#6B7280">De verschillen die er op de vloer daadwerkelijk toe doen</text>

  <!-- Kolomkoppen -->
  <g>
    <rect x="332" y="122" width="272" height="58" rx="10" fill="#F3F4F6"/>
    <text class="sb" x="468" y="152" font-size="18" fill="#374151" text-anchor="middle">Eigen dienst</text>
    <text class="b"  x="468" y="171" font-size="13" fill="#6B7280" text-anchor="middle">zelf in loondienst</text>

    <rect x="616" y="122" width="272" height="58" rx="10" fill="#F3F4F6"/>
    <text class="sb" x="752" y="152" font-size="18" fill="#374151" text-anchor="middle">Schoonmaakbedrijf</text>
    <text class="b"  x="752" y="171" font-size="13" fill="#6B7280" text-anchor="middle">uitbesteden per kamer</text>

    <rect x="900" y="122" width="252" height="58" rx="10" fill="#7C3AED"/>
    <text class="sb" x="1026" y="152" font-size="18" fill="#FFFFFF" text-anchor="middle">Uitzendbureau</text>
    <text class="b"  x="1026" y="171" font-size="13" fill="#DDD6FE" text-anchor="middle">inlenen per uur</text>
  </g>

  <!-- Rij 1: Leiding en toezicht -->
  <g>
    <rect x="48" y="196" width="1104" height="86" rx="10" fill="#FAFAFB"/>
    <text class="sb" x="72" y="234" font-size="16" fill="#111111">Leiding en toezicht</text>
    <text class="b"  x="72" y="256" font-size="13" fill="#9CA3AF">wie stuurt aan op de vloer</text>
    <text class="sb" x="468"  y="246" font-size="16" fill="#059669" text-anchor="middle">Jouw hotel</text>
    <text class="sb" x="752"  y="246" font-size="16" fill="#B45309" text-anchor="middle">De leverancier</text>
    <text class="sb" x="1026" y="246" font-size="16" fill="#059669" text-anchor="middle">Jouw hotel</text>
  </g>

  <!-- Rij 2: Cao -->
  <g>
    <rect x="48" y="292" width="1104" height="86" rx="10" fill="#FFFFFF"/>
    <text class="sb" x="72" y="330" font-size="16" fill="#111111">Cao voor de medewerker</text>
    <text class="b"  x="72" y="352" font-size="13" fill="#9CA3AF">welke arbeidsvoorwaarden gelden</text>
    <text class="b" x="468"  y="342" font-size="15" fill="#374151" text-anchor="middle">Jouw horeca-cao</text>
    <text class="b" x="752"  y="342" font-size="15" fill="#374151" text-anchor="middle">Cao Schoonmaak</text>
    <text class="b" x="1026" y="334" font-size="15" fill="#374151" text-anchor="middle">Gelijkwaardig aan</text>
    <text class="b" x="1026" y="353" font-size="15" fill="#374151" text-anchor="middle">jouw voorwaarden</text>
  </g>

  <!-- Rij 3: Kosten bij lage bezetting -->
  <g>
    <rect x="48" y="388" width="1104" height="86" rx="10" fill="#FAFAFB"/>
    <text class="sb" x="72" y="426" font-size="16" fill="#111111">Kosten bij lage bezetting</text>
    <text class="b"  x="72" y="448" font-size="13" fill="#9CA3AF">februari, dalmaanden, stille weken</text>
    <text class="sb" x="468"  y="438" font-size="16" fill="#B45309" text-anchor="middle">Lopen door</text>
    <text class="sb" x="752"  y="438" font-size="16" fill="#059669" text-anchor="middle">Dalen mee</text>
    <text class="sb" x="1026" y="438" font-size="16" fill="#059669" text-anchor="middle">Dalen mee</text>
  </g>

  <!-- Rij 4: Wisselen van partij -->
  <g>
    <rect x="48" y="484" width="1104" height="86" rx="10" fill="#FFFFFF"/>
    <text class="sb" x="72" y="522" font-size="16" fill="#111111">Wisselen van partij</text>
    <text class="b"  x="72" y="544" font-size="13" fill="#9CA3AF">hoe kom je er weer uit</text>
    <text class="b" x="468"  y="534" font-size="15" fill="#9CA3AF" text-anchor="middle">n.v.t.</text>
    <text class="b" x="752"  y="526" font-size="15" fill="#374151" text-anchor="middle">Overnameplicht personeel</text>
    <text class="b" x="752"  y="545" font-size="15" fill="#374151" text-anchor="middle">(artikel 38 cao Schoonmaak)</text>
    <text class="b" x="1026" y="534" font-size="15" fill="#374151" text-anchor="middle">Per opdracht opzegbaar</text>
  </g>

  <!-- Rij 5: Vrijwaring aansprakelijkheid -->
  <g>
    <rect x="48" y="580" width="1104" height="86" rx="10" fill="#FAFAFB"/>
    <text class="sb" x="72" y="618" font-size="16" fill="#111111">Vrijwaring aansprakelijkheid</text>
    <text class="b"  x="72" y="640" font-size="13" fill="#9CA3AF">loonheffingen en btw</text>
    <text class="b" x="468"  y="630" font-size="15" fill="#9CA3AF" text-anchor="middle">n.v.t.</text>
    <text class="b" x="752"  y="630" font-size="15" fill="#B45309" text-anchor="middle">Niet mogelijk</text>
    <text class="b" x="1026" y="622" font-size="15" fill="#374151" text-anchor="middle">Mogelijk via NEN 4400-1</text>
    <text class="b" x="1026" y="641" font-size="15" fill="#374151" text-anchor="middle">en g-rekening</text>
  </g>

  <!-- Voet -->
  <rect x="48" y="694" width="1104" height="2" fill="#E5E7EB"/>
  <text class="b" x="48" y="726" font-size="13" fill="#9CA3AF">Bij inlenen ligt de aansturing bij jou, bij uitbesteden bij de leverancier — dat is het verschil dat alle andere verschillen verklaart.</text>
  <text class="sb" x="1152" y="726" font-size="14" fill="#7C3AED" text-anchor="end">doehetextra.nl</text>
</svg>
