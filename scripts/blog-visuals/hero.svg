<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Housekeeping personeel inhuren voor hotels in Amsterdam">
  <defs>
    <style>
      .h  { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 700; }
      .b  { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 400; }
      .sb { font-family: 'Poppins', 'DejaVu Sans', sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1D0549"/>
      <stop offset="55%"  stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="linnen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Zachte vormen: bed met opgemaakt linnen, sterk vereenvoudigd -->
  <g opacity="0.95">
    <!-- matras -->
    <rect x="690" y="330" width="440" height="150" rx="18" fill="url(#linnen)"/>
    <!-- omgeslagen laken -->
    <rect x="690" y="330" width="440" height="42" rx="18" fill="#FFFFFF"/>
    <!-- kussens -->
    <rect x="716" y="286" width="150" height="62" rx="16" fill="#FFFFFF" opacity="0.96"/>
    <rect x="880" y="286" width="150" height="62" rx="16" fill="#FFFFFF" opacity="0.82"/>
    <!-- bedframe -->
    <rect x="690" y="480" width="440" height="20" rx="8" fill="#2E1065" opacity="0.55"/>
    <!-- nachtkastje + lamp -->
    <rect x="1150" y="404" width="34" height="78" rx="6" fill="#2E1065" opacity="0.45"/>
  </g>

  <!-- Zacht daglicht linksboven -->
  <defs>
    <radialGradient id="licht" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="250" cy="170" rx="330" ry="250" fill="url(#licht)"/>

  <!-- Tekst -->
  <text class="sb" x="86" y="392" font-size="17" fill="#C4B5FD" letter-spacing="1.5">HOUSEKEEPING · HOTELS · AMSTERDAM</text>
  <text class="h"  x="86" y="452" font-size="46" fill="#FFFFFF">Housekeeping personeel</text>
  <text class="h"  x="86" y="506" font-size="46" fill="#FFFFFF">inhuren</text>
  <text class="b"  x="86" y="552" font-size="20" fill="#DDD6FE">Uitzendbureau, schoonmaakbedrijf of eigen team?</text>

  <text class="sb" x="1114" y="80" font-size="17" fill="#FFFFFF" text-anchor="end" opacity="0.9">EXTRA</text>
</svg>
