    <!-- Laadscherm vanaf het eerste moment. De server zet de tekst van de pagina al in #root
         (voor zoekmachines); zonder dit zag een bezoeker die tekst eerst kaal, zonder opmaak.
         Dit vlak met draaiend rondje ligt erover tot React start (App.tsx zet html.app-klaar);

    <style>

      html:not(.app-klaar) body::after{content:"";position:fixed;left:50%;top:50%;width:48px;height:48px;margin:-42px 0 0 -24px;box-sizing:border-box;z-index:2147483647;border-radius:50%;border:4px solid rgba(248,247,244,.2);border-top-color:#F8F7F4;animation:laad-draai 1s linear infinite,laad-weg 0s 8s forwards}

      @keyframes laad-weg{to{visibility:hidden}}
    </style>
