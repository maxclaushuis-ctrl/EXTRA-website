<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="800" height="400" rx="20" fill="url(#hero_gradient)"/>
  
  <!-- Restaurant Illustration -->
  <g transform="translate(50, 50)">
    <!-- Restaurant Building -->
    <rect x="50" y="100" width="300" height="200" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <rect x="50" y="70" width="300" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <path d="M50 70L30 100L50 100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <path d="M350 70L370 100L350 100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    
    <!-- Restaurant Sign -->
    <rect x="150" y="90" width="100" height="40" rx="4" fill="#FF8A3D"/>
    <text x="200" y="117" font-family="Poppins, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">EXTRA</text>
    
    <!-- Windows -->
    <rect x="80" y="150" width="60" height="70" rx="2" fill="#E1EDFF" stroke="#333333" stroke-width="2"/>
    <rect x="170" y="150" width="60" height="70" rx="2" fill="#E1EDFF" stroke="#333333" stroke-width="2"/>
    <rect x="260" y="150" width="60" height="70" rx="2" fill="#E1EDFF" stroke="#333333" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="170" y="230" width="60" height="70" rx="2" fill="#4A7CFA" stroke="#333333" stroke-width="2"/>
    <rect x="195" y="240" width="10" height="20" rx="5" fill="#FFD700"/>
  </g>
  
  <!-- Waiter Illustration -->
  <g transform="translate(450, 100)">
    <!-- Waiter Body -->
    <rect x="90" y="120" width="100" height="130" rx="20" fill="#4A7CFA"/>
    
    <!-- Waiter Head -->
    <circle cx="140" cy="90" r="30" fill="#FFD6B0"/>
    
    <!-- Waiter Face -->
    <circle cx="130" cy="85" r="3" fill="#333333"/>
    <circle cx="150" cy="85" r="3" fill="#333333"/>
    <path d="M130 100C135 105 145 105 150 100" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Waiter Arms -->
    <path d="M90 140C70 130 60 140 65 160" stroke="#4A7CFA" stroke-width="16" stroke-linecap="round"/>
    <path d="M190 140C210 130 220 160 215 180" stroke="#4A7CFA" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Waiter Hands -->
    <circle cx="65" cy="160" r="10" fill="#FFD6B0"/>
    <circle cx="215" cy="180" r="10" fill="#FFD6B0"/>
    
    <!-- Serving Tray -->
    <ellipse cx="215" cy="180" rx="30" ry="10" fill="#DDDDDD" stroke="#333333" stroke-width="2"/>
    <ellipse cx="215" cy="180" rx="20" ry="7" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    
    <!-- Coffee Cup on Tray -->
    <rect x="205" y="170" width="10" height="8" rx="1" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <path d="M215 175H217V178C217 179 216 180 215 180Z" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <path d="M205 170C205 168 208 167 210 167C212 167 215 168 215 170" stroke="#333333" stroke-width="1"/>
    <path d="M208 175C209 176 211 176 212 175" stroke="#333333" stroke-width="1"/>
  </g>
  
  <!-- Money Icons -->
  <g transform="translate(180, 280)">
    <circle cx="20" cy="20" r="20" fill="#FFCD1D"/>
    <text x="20" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">€</text>
  </g>
  
  <g transform="translate(250, 320)">
    <circle cx="15" cy="15" r="15" fill="#FFCD1D"/>
    <text x="15" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">€</text>
  </g>
  
  <g transform="translate(540, 300)">
    <circle cx="15" cy="15" r="15" fill="#FFCD1D"/>
    <text x="15" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">€</text>
  </g>
  
  <!-- 4.8 Star Rating -->
  <g transform="translate(600, 100)">
    <rect width="140" height="40" rx="20" fill="white"/>
    <text x="40" y="27" font-family="Poppins, sans-serif" font-size="16" font-weight="bold" fill="#333333">4.8/5</text>
    <path d="M80 20L83 26H90L84 30L86 36L80 32L74 36L76 30L70 26H77L80 20Z" fill="#FFCD1D"/>
    <path d="M100 20L103 26H110L104 30L106 36L100 32L94 36L96 30L90 26H97L100 20Z" fill="#FFCD1D"/>
    <text x="120" y="27" font-family="Poppins, sans-serif" font-size="10" fill="#666666">215 reviews</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="70" r="8" fill="#FF4D8D"/>
  <circle cx="650" cy="350" r="10" fill="#4A7CFA"/>
  <circle cx="700" cy="50" r="6" fill="#FF8A3D"/>
  
  <!-- Clock Icons for Flexibility -->
  <g transform="translate(400, 330)">
    <circle cx="15" cy="15" r="15" fill="white"/>
    <circle cx="15" cy="15" r="12" fill="none" stroke="#333333" stroke-width="2"/>
    <path d="M15 7V15H20" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(580, 240)">
    <circle cx="15" cy="15" r="15" fill="white"/>
    <circle cx="15" cy="15" r="12" fill="none" stroke="#333333" stroke-width="2"/>
    <path d="M15 7V15H20" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="hero_gradient" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A7CFA"/>
      <stop offset="1" stop-color="#3360DB"/>
    </linearGradient>
  </defs>
</svg>